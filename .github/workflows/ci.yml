name: CI

on:
  push:
  pull_request:

jobs:
  posix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: linux-arm64,  os: ubuntu-24.04-arm }
          - { name: macos-arm64,  os: macos-15 }
          - { name: macos-x86_64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcapstone-dev pkg-config

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        # task_for_pid() asks for authorization interactively unless the
        # caller is root, which a headless runner can never answer.
        run: |
          brew install capstone pkg-config
          sudo DevToolsSecurity -enable

      - name: Build
        run: make

      - name: Unit tests
        run: ${{ runner.os == 'macOS' && 'sudo' || '' }} make test

      - name: Integration tests
        run: ${{ runner.os == 'macOS' && 'sudo' || '' }} bash tests/integration.sh

  windows:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, os: windows-2025,   msystem: UCRT64 }
          - { name: windows-arm64,  os: windows-11-arm, msystem: CLANGARM64 }
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: make
          pacboy: cc:p capstone:p pkgconf:p

      - name: Build
        run: make

      - name: Unit tests
        run: make test

      - name: Integration tests
        run: bash tests/integration.sh
